<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Tasks — Todo App</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- soft background tint -->
  <div class="bg-glow bg-glow--one" aria-hidden="true"></div>
  <div class="bg-glow bg-glow--two" aria-hidden="true"></div>

  <main class="app">
    <div class="card">
      <!-- ============ HEADER ============ -->
      <header class="card__header">
        <h1 class="title">My Tasks</h1>
        <p class="subtitle">Stay on top of your day</p>
      </header>

      <!-- ============ ADD / RESET ============ -->
      <form class="add-form" action="#">
        <label class="sr-only" for="new-task">New task</label>
        <div class="field">
          <input id="new-task" name="task" type="text" placeholder="What needs to be done?" autocomplete="off" />
        </div>

        <button type="button" class="btn btn--primary" onclick="addTask()">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5v14M5 12h14" />
          </svg>
          <span>Add</span>
        </button>

        <button type="reset" class="btn btn--ghost" title="Clear the input field" onclick="resetInput()">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5" />
          </svg>
          <span>Reset</span>
        </button>
      </form>

      <!-- ============ ACTION BAR ============ -->
      <div class="action-bar">
        <span class="list-label">4 tasks</span>

        <button type="button" class="btn btn--danger" onclick="clearAll()">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14" />
          </svg>
          <span>Clear all</span>
        </button>
      </div>

      <!-- ============ LIST ============ -->
      <ul class="todo-list" id="lists">
        <li class="todo">
          <span class="todo__text">Finish the landing page hero section</span>
          <div class="todo__actions">
            <button type="button" class="icon-btn" aria-label="Edit task">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" />
              </svg>
            </button>
            <button type="button" class="icon-btn icon-btn--danger" aria-label="Delete task" onclick="deleteTask()">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6" />
              </svg>
            </button>
          </div>
        </li>

         <li class="todo">
            <span class="todo__text">Water the plants on the balcony</span>
            <div class="todo__actions">
              <button type="button" class="icon-btn" aria-label="Edit task" onclick="editTask()">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"
                  />
                </svg>
              </button>
              <button
                type="button"
                class="icon-btn icon-btn--danger"
                aria-label="Delete task"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"
                  />
                </svg>
              </button>
            </div>
          </li>

          <li class="todo">
            <span class="todo__text">Push the CSS refactor to main</span>
            <div class="todo__actions">
              <button type="button" class="icon-btn" aria-label="Edit task">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"
                  />
                </svg>
              </button>
              <button
                type="button"
                class="icon-btn icon-btn--danger"
                aria-label="Delete task"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"
                  />
                </svg>
              </button>
            </div>
          </li>

          <li class="todo">
            <span class="todo__text">Book the flight tickets</span>
            <div class="todo__actions">
              <button type="button" class="icon-btn" aria-label="Edit task">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"
                  />
                </svg>
              </button>
              <button
                type="button"
                class="icon-btn icon-btn--danger"
                aria-label="Delete task"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"
                  />
                </svg>
              </button>
            </div>
          </li>
        </ul>

        <!--
        EMPTY STATE — normally ye tab dikhta hai jab list khaali ho.
        Design dekhne ke liye niche wali line se `hidden` attribute hata do
        (aur upar <ul class="todo-list"> par style="display:none" laga do).
      -->
        <div class="empty-state" hidden>
          <div class="empty-state__art" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M9 12l2 2 4-4" />
              <circle cx="12" cy="12" r="9" />
            </svg>
          </div>
          <h2>Nothing here yet</h2>
          <p>Add your first task above and it will show up right here.</p>
        </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>

</html>
